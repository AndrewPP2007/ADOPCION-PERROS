<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADOPCION-PERROS - Portal Principal</title>
    <link rel="stylesheet" href="estyle.css">
</head>
<body>
    <header>
        <h1>Refugio y Veterinaria ADOPCION-PERROS</h1>
        <p id="mensaje">Portal oficial de gestión, adopción y control de canes.</p>
        <nav class="main-nav">
            <a href="administracion/index.html">Administración</a> |
            <a href="adopciones/index.html">Adopciones</a> |
            <a href="perros/index.html">Perros</a> |
            <a href="usuarios/index.html">Usuarios</a> |
            <a href="veterinaria/index.html">Veterinaria</a>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Registro de Nuevo Can</h2>
            <form id="formMascota">
                <input type="text" id="nombreMascota" placeholder="Nombre del perro" required>
                <input type="text" id="razaMascota" placeholder="Raza" required>
                <input type="number" id="edadMascota" placeholder="Edad (años)" required>
                <button type="submit">Registrar Mascota</button>
            </form>
        </section>
    </main>

    <br>
    <button id="boton">Haz clic aquí</button>
    <script src="script.js"></script>
</body>
</html>
